telegram:
  api_id: "${API_ID}"
  api_hash: "${API_HASH}"
  user_session: "tnabil"
  sessions_dir: "sessions"
  load_dialogs_on_start: false

  bot:
    enabled: true
    token: "${BOT_TOKEN}"
    session_name: "uploader_bot"
    use_for_uploads: true

migration:
  sources:
    - chat: "@source_channel_or_-100_id"
      topic_id:
      message_range:
        start: 1
        end: 2000

  destinations:
    - chat: "@destination_channel_or_-100_id"
      topic_id:

transfer:
  include:
    videos: true
    photos: true
    text: true
    documents: false

  hide_sender: true
  drop_caption: false
  save_to_local: false
  # 0 uses the sending account's Telegram limit: 2,000 MiB for bots and
  # ordinary users, 4,000 MiB for Premium users.
  max_upload_bytes: 0
  max_bot_upload_bytes: 2097152000
  # Unknown-size media is recorded as skipped instead of being downloaded.
  allow_download_unknown_size: false

  native_copy:
    enabled: true
    only: false

  # Files above Telegram's sending limit are normally only recorded.  Set
  # action to remote and enable a preconfigured remote only if you need to
  # retain them outside Telegram.
  oversized:
    action: record              # record | remote
    remote:
      enabled: false
      method: rclone            # rclone | webdav
      # rclone example: "archive:telegram/oversized"
      # WebDAV example: "https://cloud.example/dav/telegram/oversized"
      dest: ""
      extra_args: []
      delete_local_after: true
      # Only used with method: webdav. Put real values in .env, never Git.
      username: "${WEBDAV_USERNAME}"
      password: "${WEBDAV_PASSWORD}"
      timeout_seconds: 3600

# Disabled by default.  When enabled, a matching text message or media caption
# skips the entire message or album.  Matched text is never written to logs.
filters:
  enabled: false
  case_sensitive: false
  keywords: []
  regex: []

queue:
  db_path: "data/migration.sqlite3"
  max_attempts: 4
  retry_backoff_seconds:
    - 300
    - 600
    - 1800
  record_skipped: true

limits:
  global_min_delay_seconds: 1
  resolve_delay_seconds: 2
  read_delay_seconds: 2
  download_delay_seconds: 5
  copy_delay_seconds: 10
  upload_delay_seconds: 30
  verify_delay_seconds: 2
  get_messages_chunk_size: 100
  floodwait_extra_min_seconds: 5
  floodwait_extra_max_seconds: 20
  # Longer FloodWaits are recorded for retry instead of keeping one-shot runs alive.
  floodwait_defer_after_seconds: 60
  # Account-risk errors stop the current run and retry no sooner than this delay.
  account_restricted_retry_seconds: 86400

batch:
  size: 25
  pause_between_batches_seconds: 1800
  idle_sleep_seconds: 30

downloads:
  root: "downloads"
  active_dir: "downloads/active"
  failed_dir: "downloads/failed"
  completed_dir: "downloads/completed"
  # Failed downloads are deleted by default.  Set both values below to keep a
  # bounded troubleshooting cache.
  keep_failed: false
  keep_completed: false
  # Always leave 5 GiB free for the host and other services.
  min_free_bytes: 5368709120
  # 0 prohibits failed-download accumulation.  A positive value keeps only
  # the newest job-* directories that fit below this total.
  max_failed_bytes: 0
  # 0 means each job may use at most the currently free space above the reserve.
  max_job_bytes: 0

logging:
  level: "INFO"
  file: "data/migration.log"
