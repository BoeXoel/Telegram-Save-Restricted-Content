telegram:
  api_id: "${API_ID}"
  api_hash: "${API_HASH}"
  # Use the same private name with: python main.py login --session my_user
  user_session: "my_user"
  sessions_dir: "sessions"
  # User-session only: consume dialogs at startup to populate known peers.
  # Leave false unless a target needs this extra cache warmup.
  load_dialogs_on_start: false

  # Optional unified route for every Telegram connection (Reader, Bot, login,
  # warmup, uploads, and downloads). Supported schemes: socks5 and http
  # (HTTP CONNECT only). Leave disabled to use the server's direct connection.
  # When enabled, a failed proxy never falls back to direct Telegram traffic.
  proxy:
    enabled: false
    scheme: "socks5"
    hostname: "${TELEGRAM_PROXY_HOST:}"
    port: 1080
    username: "${TELEGRAM_PROXY_USERNAME:}"
    password: "${TELEGRAM_PROXY_PASSWORD:}"

  bot:
    enabled: true
    token: "${BOT_TOKEN}"
    session_name: "uploader_bot"
    use_for_uploads: true

migration:
  sources:
    - chat: "@source_channel_or_-100_id"
      # Optional metadata for the source forum topic. Scanning still follows
      # the message range below, so choose that range within the topic.
      topic_id: null
      message_range:
        start: 1
        end: 2000

  destinations:
    - chat: "@destination_channel_or_-100_id"
      # Bot writers cannot use t.me/+... or joinchat/... here. Use this
      # group's -100… ID or a public @username, then run warmup-bot once.
      # Optional forum-topic root message ID for delivery.
      topic_id: null

transfer:
  include:
    videos: true
    photos: true
    text: true
    documents: false

  # A native copy hides visible source attribution; false prefers forwarding.
  hide_sender: true
  # Remove captions from selected media when copying, forwarding, or re-uploading.
  drop_caption: false
  # Keep successful local download/upload job directories in downloads/completed/.
  save_to_local: false
  # 0 uses the sending account's Telegram limit: 2,000 MiB for bots and
  # ordinary users, 4,000 MiB for Premium users.
  max_upload_bytes: 0
  # Bot-only override used when max_upload_bytes is 0 (2,000 MiB by default).
  max_bot_upload_bytes: 2097152000
  # Unknown-size media is recorded as skipped instead of being downloaded.
  allow_download_unknown_size: false
  # Explicit opt-in only: a Premium reading account may post 2-4 GiB media
  # when the configured bot cannot. The target permission is checked first.
  allow_premium_user_fallback: false

  native_copy:
    # Direct Telegram copy/forward only works when the reader also writes.
    enabled: true
    # true skips a job if direct copy/forward is unavailable; false re-uploads it.
    only: false

  # Files above Telegram's sending limit are normally only recorded.  Set
  # action to remote and enable a preconfigured remote only if you need to
  # retain them outside Telegram.
  oversized:
    action: record              # record | remote
    remote:
      enabled: false
      method: rclone            # rclone | webdav
      # rclone example: "archive:telegram/oversized"
      # WebDAV example: "https://cloud.example/dav/telegram/oversized"
      dest: ""
      extra_args: []
      delete_local_after: true
      # Only used with method: webdav. Put real values in .env, never Git.
      username: "${WEBDAV_USERNAME}"
      password: "${WEBDAV_PASSWORD}"
      timeout_seconds: 3600

# Disabled by default.  When enabled, a matching text message or media caption
# skips the entire message or album.  Matched text is never written to logs.
filters:
  enabled: false
  case_sensitive: false
  keywords: []
  regex: []

queue:
  db_path: "data/migration.sqlite3"
  max_attempts: 4
  retry_backoff_seconds:
    - 300
    - 600
    - 1800
  record_skipped: true

limits:
  global_min_delay_seconds: 1
  resolve_delay_seconds: 2
  read_delay_seconds: 2
  download_delay_seconds: 5
  copy_delay_seconds: 10
  upload_delay_seconds: 30
  verify_delay_seconds: 2
  get_messages_chunk_size: 100
  floodwait_extra_min_seconds: 5
  floodwait_extra_max_seconds: 20
  # Longer FloodWaits are recorded for retry instead of keeping one-shot runs alive.
  floodwait_defer_after_seconds: 60
  # Account-risk errors stop the current run and retry no sooner than this delay.
  account_restricted_retry_seconds: 86400

batch:
  size: 25
  pause_between_batches_seconds: 1800
  idle_sleep_seconds: 30

downloads:
  root: "downloads"
  active_dir: "downloads/active"
  failed_dir: "downloads/failed"
  completed_dir: "downloads/completed"
  # Failed downloads are deleted by default.  Set both values below to keep a
  # bounded troubleshooting cache.
  keep_failed: false
  keep_completed: false
  # Always leave 5 GiB free for the host and other services.
  min_free_bytes: 5368709120
  # 0 prohibits failed-download accumulation.  A positive value keeps only
  # the newest job-* directories that fit below this total.
  max_failed_bytes: 0
  # 0 means each job may use at most the currently free space above the reserve.
  max_job_bytes: 0

logging:
  level: "INFO"
  file: "data/migration.log"
